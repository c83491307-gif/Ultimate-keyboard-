name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK and run unit tests
        run: gradle assembleDebug testDebugUnitTest
      - name: Verify complete installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 5000000
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?\\.dex
          unzip -Z1 "$APK" | grep -qx 'resources.arsc'
          echo "Verified single, complete debug APK archive."
      - name: Upload full installable APK
        uses: actions/upload-artifact@v4
        with:
          name: novakeys-full-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
