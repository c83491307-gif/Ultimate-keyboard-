name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK and run unit tests
        run: gradle assembleDebug testDebugUnitTest
      - name: Verify APK and prepare alternate download
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 5000000
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?[.]dex$'
          unzip -Z1 "$APK" | grep -qx 'resources.arsc'
          mkdir -p release-assets
          cp "$APK" release-assets/app-debug.apk
          (cd release-assets && zip -9 app-debug-apk.zip app-debug.apk)
          (cd release-assets && sha256sum app-debug.apk app-debug-apk.zip > SHA256SUMS.txt)
          echo "Verified APK and created ZIP/checksum alternatives."
      - name: Upload installable APK and fallback downloads
        uses: actions/upload-artifact@v4
        with:
          name: novakeys-full-debug-apk
          path: |
            release-assets/app-debug.apk
            release-assets/app-debug-apk.zip
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish or replace public latest APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NovaKeys — Latest successful build
          body: |
            Automatically updated from the latest successful build on main.
            Direct APK: app-debug.apk
            Alternative for download managers that stall on APK files: app-debug-apk.zip (extract app-debug.apk before installing).
            SHA-256 checksums: SHA256SUMS.txt
            This is a debug APK for testing, not a Play Store production-signed release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release-assets/app-debug.apk
            release-assets/app-debug-apk.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
