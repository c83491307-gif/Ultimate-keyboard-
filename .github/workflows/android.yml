name: Android build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test, lint, and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK, run unit tests, and lint
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle assembleDebug testDebugUnitTest lintDebug
      - name: Verify APK and prepare alternate download
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 5000000
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?[.]dex$'
          unzip -Z1 "$APK" | grep -qx 'resources.arsc'
          mkdir -p release-assets
          cp "$APK" release-assets/app-debug.apk
          (cd release-assets && zip -9 app-debug-apk.zip app-debug.apk)
          (cd release-assets && sha256sum app-debug.apk app-debug-apk.zip > SHA256SUMS.txt)
          echo "Verified APK and created ZIP/checksum alternatives."
      - name: Upload installable APK and fallback downloads
        uses: actions/upload-artifact@v4
        with:
          name: novakeys-debug-downloads
          path: |
            release-assets/app-debug.apk
            release-assets/app-debug-apk.zip
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish or replace public latest test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NovaKeys — Latest successful test build
          body: |
            Automated CI test build from main.
            APK: app-debug.apk
            ZIP fallback: app-debug-apk.zip (extract the APK before installing).
            SHA-256 checksums: SHA256SUMS.txt
            This is a DEBUG test build and is not intended for Google Play production.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release-assets/app-debug.apk
            release-assets/app-debug-apk.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true

  publish:
    name: Build signed production Android App Bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/novakeys-release.jks"
          test -s "$RUNNER_TEMP/novakeys-release.jks"
      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/novakeys-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ github.ref_name }}
        run: gradle bundleRelease
      - name: Verify production bundle signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB"
          jarsigner -verify -verbose "$AAB"
          mkdir -p release-bundle
          cp "$AAB" "release-bundle/novakeys-${GITHUB_REF_NAME}.aab"
          sha256sum release-bundle/*.aab > release-bundle/SHA256SUMS.txt
      - name: Publish versioned production bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NovaKeys ${{ github.ref_name }}
          body: |
            Versioned production Android App Bundle.
            Signed bundle and SHA-256 checksum are attached.
            Complete store review, Data safety, privacy-policy URL, app-content declarations, screenshots, and device testing before rollout.
          prerelease: false
          files: |
            release-bundle/*.aab
            release-bundle/SHA256SUMS.txt
          fail_on_unmatched_files: true
