name: Android build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novakeys-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build, test, lint, and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK, run unit tests, and lint
        run: gradle assembleDebug assembleRelease testDebugUnitTest lintDebug
      - name: Verify debug APK and prepare alternate download
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 5000000
          unzip -t "$APK"
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -Eq '^classes([0-9]+)?[.]dex$'
          unzip -Z1 "$APK" | grep -qx 'resources.arsc'
          mkdir -p release-assets
          cp "$APK" release-assets/app-debug.apk
          (cd release-assets && zip -9 app-debug-apk.zip app-debug.apk)
          (cd release-assets && sha256sum app-debug.apk app-debug-apk.zip > SHA256SUMS-debug.txt)
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$RELEASE_APK"
          unzip -t "$RELEASE_APK"
          unzip -Z1 "$RELEASE_APK" | grep -qx 'AndroidManifest.xml'
          echo "Verified debug APK and unsigned release variant; production publishing still requires a valid release signature."
      - name: Upload debug APK and fallback downloads
        uses: actions/upload-artifact@v4
        with:
          name: novakeys-debug-downloads
          path: |
            release-assets/app-debug.apk
            release-assets/app-debug-apk.zip
            release-assets/SHA256SUMS-debug.txt
          if-no-files-found: error
          retention-days: 30


  emulator_smoke:
    name: Install app and smoke-test IME on Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Download the exact APK produced by the build job
        uses: actions/download-artifact@v4
        with:
          name: novakeys-debug-downloads
          path: emulator-input
      - name: Boot Android 15 emulator and test NovaKeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -camera-back none
          emulator-boot-timeout: 1200
          disable-animations: true
          script: bash .github/scripts/android-emulator-smoke.sh emulator-input/app-debug.apk
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novakeys-emulator-test-results
          path: emulator-test-results/
          if-no-files-found: ignore
          retention-days: 30

  publish_debug:
    name: Publish latest debug test build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified debug artifacts
        uses: actions/download-artifact@v4
        with:
          name: novakeys-debug-downloads
          path: release-assets
      - name: Publish latest debug test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NovaKeys — Latest successful test build
          body: |
            Automated CI test build from main.
            APK: app-debug.apk
            ZIP fallback: app-debug-apk.zip (extract the APK before installing).
            SHA-256 checksums: SHA256SUMS-debug.txt
            This is a DEBUG test build and is not a production release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release-assets/app-debug.apk
            release-assets/app-debug-apk.zip
            release-assets/SHA256SUMS-debug.txt
          fail_on_unmatched_files: true

  publish:
    name: Build and publish signed production APK and AAB
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/novakeys-release.jks"
          test -s "$RUNNER_TEMP/novakeys-release.jks"
      - name: Build signed production APK and App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/novakeys-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ github.ref_name }}
        run: gradle assembleRelease bundleRelease
      - name: Verify production signatures and artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK"
          unzip -t "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify -verbose "$AAB"
          mkdir -p release-production
          cp "$APK" "release-production/novakeys-${GITHUB_REF_NAME}.apk"
          cp "$AAB" "release-production/novakeys-${GITHUB_REF_NAME}.aab"
          (cd release-production && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Publish signed production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NovaKeys ${{ github.ref_name }}
          body: |
            Signed production Android APK and App Bundle.
            APK is for direct device installation; AAB is for Play Console submission.
            SHA-256 checksums are attached.
            Before public rollout, complete physical-device testing, privacy/Data safety declarations, store listing, and staged rollout.
          prerelease: false
          make_latest: true
          files: |
            release-production/*.apk
            release-production/*.aab
            release-production/SHA256SUMS.txt
          fail_on_unmatched_files: true
