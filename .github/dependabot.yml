version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    groups:
      android-gradle-and-kotlin:
        patterns:
          - "com.android.tools.build:*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp"
      androidx:
        patterns:
          - "androidx.*"
          - "androidx.*:*"
      testing:
        patterns:
          - "junit:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
